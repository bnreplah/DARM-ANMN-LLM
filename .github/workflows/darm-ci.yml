name: DARM-ANN CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: darm-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The upstream mesh-llm .cargo/config.toml wraps rustc with sccache, which
  # these runners do not install. An empty wrapper disables it.
  RUSTC_WRAPPER: ""
  DARM_CRATES: -p darm-core -p darm-memory -p darm-swarm -p darm-mesh-plugin

jobs:
  darm:
    name: fmt, clippy, test (DARM crates)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions are pinned to commit SHAs (tag noted alongside).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
      - name: rustfmt
        run: cargo fmt --check $DARM_CRATES
      - name: clippy
        run: cargo clippy --locked $DARM_CRATES --all-targets -- -D warnings
      - name: test
        run: cargo test --locked $DARM_CRATES
